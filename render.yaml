services:
  - type: web
    name: mvp-freelance-project-search
    runtime: python
    rootDir: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: MODE
        sync: false
      - key: KWORK_EMAIL
        sync: false
      - key: KWORK_PASSWORD
        sync: false
      - key: KWORK_COOKIES
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        sync: false
      - key: WORKZILLA_EMAIL
        sync: false
      - key: GDRIVE_VERIFY_FILE_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CONTENT_CHANNEL_ID
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: PURCHASE_URL
        sync: false
      - key: FUNNEL_CTA_AT
        sync: false
      - key: PAYMENTS_ENABLED
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_PASSWORD
        sync: false
      - key: SHEETS_SCRIPT_URL
        sync: false
      - key: SHEETS_SECRET
        sync: false

  - type: web
    name: kwork-ui
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_API_URL
        sync: false
      - key: WEBHOOK_PASSWORD
        sync: false
